# Runs the checks and the test suite on every push and every pull request.
#
# The tests run twice: once on SQLite (what a development machine uses) and
# once on a real PostgreSQL server (what the live site uses). Both matter — a
# bug that only appears on PostgreSQL once reached the live site unnoticed,
# because SQLite compares text case-insensitively and PostgreSQL does not.
#
# The PostgreSQL run rebuilds the database by applying the real migrations, so
# it also proves the migrations still produce a working database.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch makes an in-flight run pointless.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # @enhakkore/shared is consumed as a built package. This normally happens
      # through its prepare script; doing it explicitly means an install that
      # skips lifecycle scripts cannot leave dist/ missing.
      - name: Build the shared package
        run: npm run build:shared

      # The API's types come from the generated Prisma client, which does not
      # exist in a fresh checkout. The test jobs generate it themselves; this
      # one has to ask. No DATABASE_URL is needed — only the types.
      - name: Generate the database client
        run: npm run db:generate --workspace @enhakkore/api

      - name: Typecheck
        run: npm run typecheck

      # Proves the site still compiles. No API or database is needed: every
      # page that depends on live data is rendered on demand, not at build time.
      - name: Build the website
        run: npm run build --workspace @enhakkore/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          API_URL: http://localhost:4000/api

  test:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest

    strategy:
      # Run both databases even when one fails, so the report shows which.
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]

    # The database the PostgreSQL run erases and rebuilds. Started for both
    # runs — the SQLite one simply ignores it, which costs a few seconds and
    # keeps this file free of conditional service wiring.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enhakkore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the shared package
        run: npm run build:shared

      - name: Shared tests
        run: npm run test --workspace @enhakkore/shared

      - name: API tests
        run: npm run test --workspace @enhakkore/api
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql://postgres:postgres@localhost:5432/enhakkore_test?schema=public' || '' }}
