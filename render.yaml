# Render blueprint for the Enhakkore API.
#
# The API needs a persistent Node process — it holds a pooled database
# connection between requests and is where Socket.IO lives for trip group chat.
# That is why it runs on Render rather than beside the web app on Vercel.
#
# The build does everything the database needs: it creates or updates the tables
# and, on a brand-new empty database only, loads the demonstration content. No
# command has to be run by hand.

services:
  - type: web
    name: enhakkore-api
    runtime: node
    plan: free
    region: frankfurt # closest of Render's regions to East Africa
    # --include=dev matters: NODE_ENV=production would otherwise make npm skip
    # devDependencies, and Prisma and TypeScript are needed to build.
    buildCommand: npm install --include=dev && npm run deploy:api
    startCommand: npm run start --workspace @enhakkore/api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PAYMENT_PROVIDER
        value: mock
      # Demonstration content is never loaded into the live database. (An
      # existing database is never re-seeded either way.)
      - key: SEED_DEMO_DATA
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      # Set these in the dashboard — never commit them.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # The owner's sign-in for the control centre. On the next deploy the
      # bootstrap creates this account if no real owner exists yet. Use a long,
      # unique password (12+ characters); it is only ever stored as a hash.
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_NAME
        sync: false
      # One-time founder setup at /admin/setup (alternative to OWNER_*): a random
      # secret of 24+ characters. Setup closes for good once the founder's
      # account exists; remove this variable afterwards.
      - key: SETUP_TOKEN
        sync: false
      # WhatsApp Business Platform (Meta Cloud API) — automatic enquiry notices
      # to the team numbers in Settings → Contacts. Leave unset until configured.
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false
