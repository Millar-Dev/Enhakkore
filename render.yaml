# Render blueprint for the Enhakkore API.
#
# The API needs a persistent Node process — it holds Socket.IO connections open
# for trip group chat and keeps a pooled database connection between requests.
# That is why it does not go on Vercel alongside the web app.
#
# To use: Render Dashboard → New → Blueprint → point at this repository.
# Then set the three secret values marked `sync: false` in the dashboard.

services:
  - type: web
    name: enhakkore-api
    runtime: node
    plan: free
    region: frankfurt # closest of Render's regions to East Africa
    rootDir: .
    buildCommand: npm install && npm run build:api && npm run db:deploy --workspace @enhakkore/api
    startCommand: npm run start --workspace @enhakkore/api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEED_DEMO_DATA
        value: "false"
      - key: PAYMENT_PROVIDER
        value: mock
      - key: JWT_EXPIRES_IN
        value: 7d
      # Set these three in the Render dashboard — never commit them.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
